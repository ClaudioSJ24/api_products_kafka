spring.application.name=product-api
server.port=8080



#NOMBRE DE TOPICO name-topic-commands-out-0 QUE SE COMUNICARA CON OTRO MICROSERVICIO ATRAVES DE products.commands
spring.cloud.stream.bindings.name-topic-commands-out-0.destination=products.commands
spring.cloud.stream.bindings.name-topic-commands-out-0.content-type=application/json

spring.cloud.function.definition=repliesHandlers
spring.cloud.stream.bindings.repliesHandlers-in-0.destination=products.replies
spring.cloud.stream.bindings.repliesHandlers-in-0.content-type=application/json
spring.cloud.stream.bindings.repliesHandlers-in-0.group=product-api
spring.cloud.stream.kafka.binder.brokers=localhost:9092


